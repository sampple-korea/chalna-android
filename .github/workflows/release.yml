name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, publish, re-download
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.version }}
      CHALNA_RELEASE_STORE_PASSWORD: ${{ secrets.CHALNA_RELEASE_STORE_PASSWORD }}
      CHALNA_RELEASE_KEY_ALIAS: ${{ secrets.CHALNA_RELEASE_KEY_ALIAS }}
      CHALNA_RELEASE_KEY_PASSWORD: ${{ secrets.CHALNA_RELEASE_KEY_PASSWORD }}
      CHALNA_KEYSTORE_PATH: ${{ github.workspace }}/.release/chalna-release.p12
    steps:
      - name: Validate version and immutable release policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "1.0.0"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled == true' | grep -qx true
      - name: Checkout exact main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CHALNA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          install -d -m 700 .release
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$CHALNA_KEYSTORE_PATH"
          chmod 600 "$CHALNA_KEYSTORE_PATH"
      - name: Policy, tests, and signed release build
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./scripts/policy-check.ps1
          export BUILD_DATE_UTC="$(git show -s --format=%cI "$GITHUB_SHA")"
          ./gradlew --no-daemon --stacktrace :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
      - name: Validate signed APK and create metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="app/build/outputs/apk/release/app-release.apk"
          APK="chalna-v${VERSION}-release.apk"
          CHECKSUM="chalna-v${VERSION}-SHA256.txt"
          INFO="chalna-v${VERSION}-build-info.json"
          test -s "$APK_IN"
          cp "$APK_IN" "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          CERT_OUTPUT="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          grep -q 'Verified using v2 scheme.*true' <<< "$CERT_OUTPUT"
          CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$CERT_OUTPUT" | head -1 | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT_SHA"
          ! grep -qi 'Android Debug' <<< "$CERT_OUTPUT"
          APP_ID="$($BUILD_TOOLS/apkanalyzer manifest application-id "$APK")"
          VERSION_NAME="$($BUILD_TOOLS/apkanalyzer manifest version-name "$APK")"
          VERSION_CODE="$($BUILD_TOOLS/apkanalyzer manifest version-code "$APK")"
          MIN_SDK="$($BUILD_TOOLS/apkanalyzer manifest min-sdk "$APK")"
          TARGET_SDK="$($BUILD_TOOLS/apkanalyzer manifest target-sdk "$APK")"
          test "$APP_ID" = 'app.chalna.capture'
          test "$VERSION_NAME" = "$VERSION"
          test "$VERSION_CODE" = '1'
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee permissions.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
          ! "$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          printf '%s  %s\n' "$SHA" "$APK" > "$CHECKSUM"
          jq -n \
            --arg applicationId "$APP_ID" --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" --arg gitCommit "$GITHUB_SHA" \
            --arg tag "v$VERSION" --arg apkFilename "$APK" --argjson apkByteSize "$SIZE" \
            --arg sha256 "$SHA" --arg signingCertificateSha256 "$CERT_SHA" \
            --argjson minSdk "$MIN_SDK" --argjson targetSdk "$TARGET_SDK" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{applicationId:$applicationId,versionName:$versionName,versionCode:$versionCode,gitCommit:$gitCommit,tag:$tag,apkFilename:$apkFilename,apkByteSize:$apkByteSize,sha256:$sha256,signingCertificateSha256:$signingCertificateSha256,minSdk:$minSdk,targetSdk:$targetSdk,buildWorkflowRunId:$workflowRunId}' > "$INFO"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "info=$INFO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
      - name: Create complete draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "${{ steps.apk.outputs.apk }}" \
            "${{ steps.apk.outputs.checksum }}" \
            "${{ steps.apk.outputs.info }}" \
            --draft --target "$GITHUB_SHA" --title "Chalna v$VERSION" --notes-file docs/RELEASE_NOTES_v1.0.0.md
          test "$(gh release view "v$VERSION" --json assets --jq '.assets | length')" = '3'
          test "$(gh release view "v$VERSION" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --draft=false --prerelease=false
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = 'false'
      - name: Re-download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir remote
          gh release download "v$VERSION" --dir remote
          cd remote
          sha256sum -c "chalna-v${VERSION}-SHA256.txt"
          test "$(sha256sum "chalna-v${VERSION}-release.apk" | cut -d' ' -f1)" = "${{ steps.apk.outputs.sha }}"
          gh release verify-asset "v$VERSION" "chalna-v${VERSION}-release.apk" --repo "$GITHUB_REPOSITORY"
          gh release verify "v$VERSION" --repo "$GITHUB_REPOSITORY"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          REMOTE_CERT="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "chalna-v${VERSION}-release.apk")"
          grep -q "Signer #1 certificate SHA-256 digest: $(tr '[:upper:]' '[:lower:]' <<< '${{ steps.apk.outputs.cert_sha }}')" <<< "$REMOTE_CERT"
          test "$($BUILD_TOOLS/apkanalyzer manifest application-id "chalna-v${VERSION}-release.apk")" = 'app.chalna.capture'
          test "$($BUILD_TOOLS/apkanalyzer manifest version-name "chalna-v${VERSION}-release.apk")" = "$VERSION"
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -rf .release
