name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        default: 1.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, publish, and re-download
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.version }}
      CHALNA_KEYSTORE_PATH: ${{ github.workspace }}/.release/chalna-release.p12
      EXPECTED_RELEASE_CERT_SHA256: E1344975A288EC785AB12841CA8719B2115EADF41AE6F6E7AB8770979B7FA2B9
      BUNDLETOOL_JAR: ${{ github.workspace }}/.release/bundletool.jar
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate version, tag, and release tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source version.properties
          test "$VERSION_NAME" = "$VERSION"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore and verify signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CHALNA_RELEASE_KEYSTORE_B64 }}
          CHALNA_RELEASE_STORE_PASSWORD: ${{ secrets.CHALNA_RELEASE_STORE_PASSWORD }}
          CHALNA_RELEASE_KEY_ALIAS: ${{ secrets.CHALNA_RELEASE_KEY_ALIAS }}
          CHALNA_RELEASE_KEY_PASSWORD: ${{ secrets.CHALNA_RELEASE_KEY_PASSWORD }}
          CHALNA_RELEASE_CERT_SHA256: ${{ secrets.CHALNA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$CHALNA_RELEASE_STORE_PASSWORD"
          test -n "$CHALNA_RELEASE_KEY_ALIAS"
          test -n "$CHALNA_RELEASE_KEY_PASSWORD"
          test "$CHALNA_RELEASE_CERT_SHA256" = "$EXPECTED_RELEASE_CERT_SHA256"
          install -d -m 700 .release
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$CHALNA_KEYSTORE_PATH"
          chmod 600 "$CHALNA_KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$CHALNA_KEYSTORE_PATH" \
            -storepass "$CHALNA_RELEASE_STORE_PASSWORD" -alias "$CHALNA_RELEASE_KEY_ALIAS" >/dev/null
      - name: Download pinned bundletool and previous signed APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$BUNDLETOOL_JAR" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' \
            'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
            "$BUNDLETOOL_JAR" | sha256sum --check
          mkdir previous-release
          gh release download v1.1.1 --pattern 'chalna-v1.1.1-release.apk' --dir previous-release
          test -s previous-release/chalna-v1.1.1-release.apk
      - name: Policy, formatting, static analysis, tests, and signed builds
        shell: bash
        env:
          CHALNA_RELEASE_STORE_PASSWORD: ${{ secrets.CHALNA_RELEASE_STORE_PASSWORD }}
          CHALNA_RELEASE_KEY_ALIAS: ${{ secrets.CHALNA_RELEASE_KEY_ALIAS }}
          CHALNA_RELEASE_KEY_PASSWORD: ${{ secrets.CHALNA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pwsh ./scripts/policy-check.ps1
          BUILD_DATE_UTC="$(git show -s --format=%cI "$GITHUB_SHA")"
          export BUILD_DATE_UTC
          ./gradlew --no-daemon --stacktrace :app:dependencies --configuration releaseRuntimeClasspath | tee dependency-report.txt
          if grep -Ei 'androidx\.compose\.material(3)?:|com\.google\.android\.material:|material-icons-(core|extended)|androidx\.media3:media3-ui-compose-material3' dependency-report.txt | grep -Ev '\(c\)$'; then
            echo 'Resolved dependency graph contains a forbidden Material dependency.' >&2
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace \
            :app:ktlintCheck \
            :app:detekt \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:bundleRelease \
            cyclonedxBom
      - name: Validate APK, AAB, signer continuity, 16 KB alignment, and SBOM
        id: artifacts
        shell: bash
        env:
          CHALNA_RELEASE_CERT_SHA256: ${{ secrets.CHALNA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sbom_source=''
          sbom_source="$(find build/reports -type f -name 'bom.json' -size +0c | head -n 1)"
          test -n "$sbom_source"
          bash scripts/validate-release-artifacts.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            previous-release/chalna-v1.1.1-release.apk \
            "$sbom_source"
      - name: Upload private release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/
            dependency-report.txt
            release-*.txt
            release-*.xml
      - name: Reclaim runner space for emulator verification
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM access
        shell: bash
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Verify update install, clean install, and Assistant qualification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: aosp_atd
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install previous-release/chalna-v1.1.1-release.apk
            adb shell am start -W -n app.chalna.capture/app.chalna.capture.MainActivity
            adb install -r "${{ steps.artifacts.outputs.apk }}"
            bash scripts/verify-assistant-role.sh app.chalna.capture
            adb shell am force-stop app.chalna.capture
            adb shell am start -W -n app.chalna.capture/app.chalna.capture.MainActivity
            test -n "$(adb shell pidof app.chalna.capture)"
            adb uninstall app.chalna.capture
            adb install "${{ steps.artifacts.outputs.apk }}"
            bash scripts/verify-assistant-role.sh app.chalna.capture
            adb shell am start -W -n app.chalna.capture/app.chalna.capture.MainActivity
            test -n "$(adb shell pidof app.chalna.capture)"
      - name: Verify release launch on a 16 KB page-size emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis_ps16k
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
            test "$page_size" = '16384'
            adb install "${{ steps.artifacts.outputs.apk }}"
            adb shell am start -W -n app.chalna.capture/app.chalna.capture.MainActivity
            test -n "$(adb shell pidof app.chalna.capture)"
      - name: Create complete draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "${{ steps.artifacts.outputs.apk }}" \
            "${{ steps.artifacts.outputs.aab }}" \
            "${{ steps.artifacts.outputs.checksum }}" \
            "${{ steps.artifacts.outputs.info }}" \
            "${{ steps.artifacts.outputs.sbom }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Chalna v$VERSION" \
            --notes-file docs/RELEASE_NOTES_v1.2.0.md
          test "$(gh release view "v$VERSION" --json assets --jq '.assets | length')" = '5'
          test "$(gh release view "v$VERSION" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          actual_assets="$(gh release view "v$VERSION" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          expected_assets="$(printf '%s\n' \
            "chalna-v${VERSION}-SHA256.txt" \
            "chalna-v${VERSION}-build-info.json" \
            "chalna-v${VERSION}-release.aab" \
            "chalna-v${VERSION}-release.apk" \
            "chalna-v${VERSION}-sbom.json")"
          test "$actual_assets" = "$expected_assets"
          test "$(gh release view "v$VERSION" --json assets --jq '[.assets[] | select(.size <= 0)] | length')" = '0'
      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --draft=false --prerelease=false
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = 'false'
      - name: Re-download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir remote-release
          gh release download "v$VERSION" --dir remote-release
          cd remote-release
          sha256sum -c "chalna-v${VERSION}-SHA256.txt"
          test "$(sha256sum "chalna-v${VERSION}-release.apk" | cut -d' ' -f1)" = "${{ steps.artifacts.outputs.apk_sha }}"
          test "$(sha256sum "chalna-v${VERSION}-release.aab" | cut -d' ' -f1)" = "${{ steps.artifacts.outputs.aab_sha }}"
          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify-asset "v$VERSION" "chalna-v${VERSION}-release.apk" --repo "$GITHUB_REPOSITORY" && \
              gh release verify-asset "v$VERSION" "chalna-v${VERSION}-release.aab" --repo "$GITHUB_REPOSITORY" && \
              gh release verify "v$VERSION" --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            if test "$attempt" -lt 12; then
              sleep 10
            fi
          done
          test "$verified" = true
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = 'true'
          build_tools_version="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          build_tools="$ANDROID_HOME/build-tools/$build_tools_version"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          remote_certificate_output="$("$build_tools/apksigner" verify --verbose --print-certs "chalna-v${VERSION}-release.apk")"
          remote_certificate_sha="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$remote_certificate_output" | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$remote_certificate_sha" = "${{ steps.artifacts.outputs.certificate_sha }}"
          test "$remote_certificate_sha" = "$EXPECTED_RELEASE_CERT_SHA256"
          test "$("$apkanalyzer" manifest application-id "chalna-v${VERSION}-release.apk")" = 'app.chalna.capture'
          test "$("$apkanalyzer" manifest version-name "chalna-v${VERSION}-release.apk")" = "$VERSION"
          test "$("$apkanalyzer" manifest version-code "chalna-v${VERSION}-release.apk")" = "$VERSION_CODE"
          java -jar "$BUNDLETOOL_JAR" validate --bundle "chalna-v${VERSION}-release.aab"
          aab_certificate_sha="$(keytool -printcert -jarfile "chalna-v${VERSION}-release.aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$aab_certificate_sha" = "$EXPECTED_RELEASE_CERT_SHA256"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$VERSION" --argjson code "$VERSION_CODE" \
            '.gitCommit == $sha and .versionName == $version and .versionCode == $code' \
            "chalna-v${VERSION}-build-info.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "chalna-v${VERSION}-sbom.json"
      - name: Remove failed draft release
        if: failure()
        shell: bash
        run: |
          if test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = 'true'; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -rf .release
