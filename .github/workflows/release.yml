name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, publish, re-download
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.version }}
      CHALNA_KEYSTORE_PATH: ${{ github.workspace }}/.release/chalna-release.p12
    steps:
      - name: Validate version and release tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "1.0.0"
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Checkout exact main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CHALNA_RELEASE_KEYSTORE_B64 }}
          CHALNA_RELEASE_STORE_PASSWORD: ${{ secrets.CHALNA_RELEASE_STORE_PASSWORD }}
          CHALNA_RELEASE_KEY_ALIAS: ${{ secrets.CHALNA_RELEASE_KEY_ALIAS }}
          CHALNA_RELEASE_KEY_PASSWORD: ${{ secrets.CHALNA_RELEASE_KEY_PASSWORD }}
          CHALNA_RELEASE_CERT_SHA256: ${{ secrets.CHALNA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$CHALNA_RELEASE_STORE_PASSWORD"
          test -n "$CHALNA_RELEASE_KEY_ALIAS"
          test -n "$CHALNA_RELEASE_KEY_PASSWORD"
          test -n "$CHALNA_RELEASE_CERT_SHA256"
          install -d -m 700 .release
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$CHALNA_KEYSTORE_PATH"
          chmod 600 "$CHALNA_KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$CHALNA_KEYSTORE_PATH" \
            -storepass "$CHALNA_RELEASE_STORE_PASSWORD" -alias "$CHALNA_RELEASE_KEY_ALIAS" >/dev/null
      - name: Policy, tests, and signed release build
        shell: bash
        env:
          CHALNA_RELEASE_STORE_PASSWORD: ${{ secrets.CHALNA_RELEASE_STORE_PASSWORD }}
          CHALNA_RELEASE_KEY_ALIAS: ${{ secrets.CHALNA_RELEASE_KEY_ALIAS }}
          CHALNA_RELEASE_KEY_PASSWORD: ${{ secrets.CHALNA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pwsh ./scripts/policy-check.ps1
          export BUILD_DATE_UTC="$(git show -s --format=%cI "$GITHUB_SHA")"
          ./gradlew --no-daemon --stacktrace :app:lintRelease :app:testDebugUnitTest :app:assembleRelease
      - name: Validate signed APK and create metadata
        id: apk
        shell: bash
        env:
          CHALNA_RELEASE_CERT_SHA256: ${{ secrets.CHALNA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_IN="app/build/outputs/apk/release/app-release.apk"
          APK="chalna-v${VERSION}-release.apk"
          CHECKSUM="chalna-v${VERSION}-SHA256.txt"
          INFO="chalna-v${VERSION}-build-info.json"
          test -s "$APK_IN"
          cp "$APK_IN" "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          CERT_OUTPUT="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          grep -q 'Verified using v2 scheme.*true' <<< "$CERT_OUTPUT"
          CERT_SHA="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$CERT_OUTPUT" | head -1 | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT_SHA"
          test "$CERT_SHA" = "$CHALNA_RELEASE_CERT_SHA256"
          ! grep -qi 'Android Debug' <<< "$CERT_OUTPUT"
          APP_ID="$($APKANALYZER manifest application-id "$APK")"
          VERSION_NAME="$($APKANALYZER manifest version-name "$APK")"
          VERSION_CODE="$($APKANALYZER manifest version-code "$APK")"
          MIN_SDK="$($APKANALYZER manifest min-sdk "$APK")"
          TARGET_SDK="$($APKANALYZER manifest target-sdk "$APK")"
          test "$APP_ID" = 'app.chalna.capture'
          test "$VERSION_NAME" = "$VERSION"
          test "$VERSION_CODE" = '1'
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee permissions.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
          ! "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'android:debuggable.*0xffffffff'
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          printf '%s  %s\n' "$SHA" "$APK" > "$CHECKSUM"
          jq -n \
            --arg applicationId "$APP_ID" --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" --arg gitCommit "$GITHUB_SHA" \
            --arg tag "v$VERSION" --arg apkFilename "$APK" --argjson apkByteSize "$SIZE" \
            --arg sha256 "$SHA" --arg signingCertificateSha256 "$CERT_SHA" \
            --argjson minSdk "$MIN_SDK" --argjson targetSdk "$TARGET_SDK" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{applicationId:$applicationId,versionName:$versionName,versionCode:$versionCode,gitCommit:$gitCommit,tag:$tag,apkFilename:$apkFilename,apkByteSize:$apkByteSize,sha256:$sha256,signingCertificateSha256:$signingCertificateSha256,minSdk:$minSdk,targetSdk:$targetSdk,buildWorkflowRunId:$workflowRunId}' > "$INFO"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "info=$INFO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
      - name: Reclaim runner space for release smoke test
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM access for release smoke test
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm || true
            if test -r /dev/kvm -a -w /dev/kvm; then
              echo "KVM acceleration is available."
            else
              echo "KVM is not accessible; emulator runner will use its software fallback."
            fi
          else
            echo "KVM is unavailable; using the emulator software fallback."
          fi
      - name: Install and launch signed release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: aosp_atd
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r "${{ steps.apk.outputs.apk }}"
            adb shell am start -W -n app.chalna.capture/app.chalna.capture.MainActivity
            test -n "$(adb shell pidof app.chalna.capture)"
      - name: Create complete draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "${{ steps.apk.outputs.apk }}" \
            "${{ steps.apk.outputs.checksum }}" \
            "${{ steps.apk.outputs.info }}" \
            --draft --target "$GITHUB_SHA" --title "Chalna v$VERSION" --notes-file docs/RELEASE_NOTES_v1.0.0.md
          test "$(gh release view "v$VERSION" --json assets --jq '.assets | length')" = '3'
          test "$(gh release view "v$VERSION" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          test "$(gh release view "v$VERSION" --json assets --jq '[.assets[].name] | sort | join("\n")')" = "$(printf '%s\n' \
            "chalna-v${VERSION}-SHA256.txt" \
            "chalna-v${VERSION}-build-info.json" \
            "chalna-v${VERSION}-release.apk")"
          test "$(gh release view "v$VERSION" --json assets --jq '[.assets[] | select(.size <= 0)] | length')" = '0'
      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --draft=false --prerelease=false
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = 'false'
      - name: Re-download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir remote
          gh release download "v$VERSION" --dir remote
          cd remote
          sha256sum -c "chalna-v${VERSION}-SHA256.txt"
          test "$(sha256sum "chalna-v${VERSION}-release.apk" | cut -d' ' -f1)" = "${{ steps.apk.outputs.sha }}"
          gh release verify-asset "v$VERSION" "chalna-v${VERSION}-release.apk" --repo "$GITHUB_REPOSITORY"
          gh release verify "v$VERSION" --repo "$GITHUB_REPOSITORY"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          REMOTE_CERT="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "chalna-v${VERSION}-release.apk")"
          REMOTE_CERT_SHA="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$REMOTE_CERT" | head -1 | tr '[:lower:]' '[:upper:]')"
          test "$REMOTE_CERT_SHA" = '${{ steps.apk.outputs.cert_sha }}'
          test "$($APKANALYZER manifest application-id "chalna-v${VERSION}-release.apk")" = 'app.chalna.capture'
          test "$($APKANALYZER manifest version-name "chalna-v${VERSION}-release.apk")" = "$VERSION"
      - name: Remove failed draft release
        if: failure()
        shell: bash
        run: |
          if test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = 'true'; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -rf .release
