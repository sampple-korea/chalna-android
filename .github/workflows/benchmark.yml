name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-and-benchmark:
    name: Baseline profile and macrobenchmark
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Reclaim runner space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM access
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Generate profile and measure startup
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/run-benchmark.sh
      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          find app benchmark -type f \( -name '*-startup-prof*.txt' -o -name '*benchmarkData.json' -o -name '*.trace' \) -print | tee benchmark-files.txt
          test -s generated-baseline-prof.txt
          test -s generated-startup-prof.txt
          test "$(wc -l < generated-baseline-prof.txt)" -ge 20
          test "$(wc -l < generated-startup-prof.txt)" -ge 20
          RESULT="$(find benchmark/build/outputs -type f -name '*benchmarkData.json' -size +0c | head -1)"
          test -n "$RESULT"
          python3 scripts/verify-benchmark-results.py benchmark/performance-baseline.json "$RESULT"
      - name: Upload profiles and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            app/src/release/generated/baselineProfiles/
            app/build/outputs/
            benchmark/build/outputs/
            benchmark-files.txt
            benchmark-gate.json
            generated-baseline-prof.txt
            generated-startup-prof.txt
