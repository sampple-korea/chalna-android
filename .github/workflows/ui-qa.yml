name: UI QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Instrumentation, screenshots, accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Policy before emulator
        shell: pwsh
        run: ./scripts/policy-check.ps1
      - name: Reclaim runner space for emulator userdata
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM access
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm || true
            if test -r /dev/kvm -a -w /dev/kvm; then
              echo "KVM acceleration is available."
            else
              echo "KVM is not accessible; emulator runner will use its software fallback."
            fi
          else
            echo "KVM is unavailable on this runner; emulator runner will use its software fallback."
          fi
      - name: Run fixed emulator suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          target: aosp_atd
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put system font_scale 1.0
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class app.chalna.capture.ui.ChalnaScreenshotTest app.chalna.capture.debug.test/androidx.test.runner.AndroidJUnitRunner | tee screenshot-instrumentation.txt
            grep -q '^OK (' screenshot-instrumentation.txt
            ! grep -q 'FAILURES!!!' screenshot-instrumentation.txt
            mkdir -p ui-screenshots
            adb pull /sdcard/Android/data/app.chalna.capture.debug/files/screenshots/. ui-screenshots/ || true
            for screenshot in \
              home-ready-mist.png home-recording-night.png setup-mist.png settings-night.png \
              gallery-night.png gallery-selection-night.png gallery-empty-night.png \
              gallery-vault-filter-night.png gallery-vault-selection-night.png \
              gallery-delete-confirmation-night.png gallery-mist.png \
              player-night.png player-controls-hidden-night.png player-info-night.png \
              player-delete-confirmation-night.png player-vault-night.png \
              settings-camera-denied-night.png settings-audio-off-night.png \
              settings-assistant-missing-night.png settings-notification-optional-night.png settings-vault-mist.png \
              glow-start-000-night.png glow-start-016-night.png glow-start-034-night.png \
              glow-start-050-night.png glow-start-078-night.png glow-stop-050-mist.png \
              glow-error-050-night.png glow-start-tall-colorful-night.png glow-start-compact-rounded-night.png \
              glow-stop-wide-cutout-mist.png icon-mask-circle.png icon-mask-squircle.png icon-mask-square.png \
              icon-mask-monochrome.png home-large-font-mist.png gallery-large-font-night.png \
              settings-large-font-mist.png; do
              test -n "$(find ui-screenshots -type f -name "$screenshot" -size +0c -print -quit)" || {
                echo "Required screenshot artifact is missing or empty: $screenshot" >&2
                exit 1
              }
            done
            adb shell am start -W -n app.chalna.capture.debug/app.chalna.capture.MainActivity
            adb shell pidof app.chalna.capture.debug
      - name: Upload UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qa-api-${{ matrix.api-level }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            screenshot-instrumentation.txt
            ui-screenshots/
