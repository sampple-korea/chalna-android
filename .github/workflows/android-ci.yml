name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Policy, lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Repository policy
        shell: pwsh
        run: ./scripts/policy-check.ps1
      - name: Formatting
        shell: pwsh
        run: ./scripts/format-check.ps1
      - name: Static source analysis
        shell: pwsh
        run: ./scripts/static-analysis.ps1
      - name: Dependency verification and Android checks
        run: ./gradlew --no-daemon --stacktrace :app:dependencies :app:lintRelease :app:testDebugUnitTest :app:assembleDebug
      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
