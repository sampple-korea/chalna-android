name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Policy, lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Repository policy
        shell: pwsh
        run: ./scripts/policy-check.ps1
      - name: Formatting
        shell: pwsh
        run: ./scripts/format-check.ps1
      - name: Static source analysis
        shell: pwsh
        run: ./scripts/static-analysis.ps1
      - name: Resolve and inspect dependency graph
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:dependencies :benchmark:dependencies > full-dependency-report.txt
          ./gradlew --no-daemon --stacktrace :app:dependencies --configuration releaseRuntimeClasspath | tee dependency-report.txt
          if grep -Ei 'androidx\.compose\.material(3)?:|com\.google\.android\.material:|material-icons-(core|extended)|androidx\.media3:media3-ui-compose-material3' dependency-report.txt | grep -Ev '\(c\)$'; then
            echo "Resolved dependency graph contains a forbidden Material dependency." >&2
            exit 1
          fi
      - name: Formatting and Detekt
        run: ./gradlew --no-daemon --stacktrace :app:ktlintCheck :app:detekt
      - name: Android lint, unit tests, and debug APK
        run: ./gradlew --no-daemon --stacktrace :app:lintRelease :app:testDebugUnitTest :app:assembleDebug
      - name: Verify unit-test result artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t results < <(find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -size +0c -print)
          test "${#results[@]}" -gt 0
          test -s app/build/test-results/testDebugUnitTest/TEST-app.chalna.capture.data.CaptureIndexTest.xml
          test -s app/build/test-results/testDebugUnitTest/TEST-app.chalna.capture.domain.GalleryModelsTest.xml
          test -s app/build/test-results/testDebugUnitTest/TEST-app.chalna.capture.gallery.GalleryRepositoryTest.xml
          if grep -E -q '(failures|errors)="[1-9][0-9]*"' "${results[@]}"; then
            echo "Unit-test XML reports contain failures or errors." >&2
            exit 1
          fi
      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk
            app/schemas/
            app/gradle.lockfile
            benchmark/gradle.lockfile
            gradle/verification-metadata.xml
            dependency-report.txt
            full-dependency-report.txt
