name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Workflow, dependency, secret, and SBOM audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' actionlint.tar.gz | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          shellcheck scripts/*.sh
      - name: Repository and manifest policy
        shell: pwsh
        run: ./scripts/policy-check.ps1
      - name: Scan tracked content for credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{30,}|CHALNA_RELEASE_STORE_PASSWORD[[:space:]]*=)' -- ':!docs/THREAT_MODEL.md'; then
            echo "Tracked content contains a credential-like value." >&2
            exit 1
          fi
          test -z "$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx')"
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon --stacktrace cyclonedxBom
      - name: Validate SBOM
        shell: bash
        run: |
          set -euo pipefail
          SBOM="$(find build/reports -type f -name 'bom.json' -size +0c | head -1)"
          test -n "$SBOM"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$SBOM"
          cp "$SBOM" chalna-sbom.json
      - name: Upload security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-policy-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: chalna-sbom.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Build analyzed variant
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Analyze without remote upload dependency
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          output: codeql-results
          upload: false
      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: codeql-results/
